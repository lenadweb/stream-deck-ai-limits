<!DOCTYPE html>
<html>

<head lang="en">
    <title>Antigravity Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        select.sdpi-item-value {
            width: 100%;
            padding: 4px 8px;
            border-radius: 4px;
            background: #2d2d2d;
            color: #ddd;
            border: 1px solid #444;
            font-size: 12px;
        }
        .hidden {
            display: none;
        }
        .info {
            padding: 4px 16px;
            font-size: 11px;
            color: #999;
            line-height: 1.4;
        }
        .link {
            color: #4285F4;
            cursor: pointer;
            text-decoration: underline;
        }
        .link:hover {
            color: #357ae8;
        }
        .auth-row {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-row button {
            padding: 5px 12px;
            border-radius: 4px;
            background: #4285F4;
            color: white;
            border: 0;
            font-size: 12px;
            cursor: pointer;
        }
        .auth-row button.logout {
            background: #444;
        }
        .auth-row button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .auth-status {
            font-size: 11px;
            color: #9ca3af;
            flex: 1;
        }
        .auth-status.ok {
            color: #10b981;
        }
        .auth-status.err {
            color: #ef4444;
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #ddd;
            cursor: pointer;
        }
        .checkbox input {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="auth-row">
        <button id="loginBtn" type="button">Sign in with Google</button>
        <button id="logoutBtn" type="button" class="logout" style="display:none">Sign out</button>
        <span id="authStatus" class="auth-status">Not signed in</span>
    </div>

    <sdpi-item label="Layout">
        <select id="layout" class="sdpi-item-value">
            <option value="ring">Ring (one model)</option>
            <option value="bars">Bars (two models)</option>
        </select>
    </sdpi-item>

    <sdpi-item id="ringRow" label="Model">
        <select id="model" class="sdpi-item-value">
            <option value="">Overall (Most Constrained)</option>
        </select>
    </sdpi-item>

    <sdpi-item id="topRow" label="Top Bar Model">
        <select id="topModel" class="sdpi-item-value">
            <option value="">Overall (Most Constrained)</option>
        </select>
    </sdpi-item>

    <sdpi-item id="bottomRow" label="Bottom Bar Model">
        <select id="bottomModel" class="sdpi-item-value">
            <option value="">Overall (Most Constrained)</option>
        </select>
    </sdpi-item>

    <sdpi-item label="Display">
        <label class="checkbox"><input id="showProviderName" type="checkbox" /> Show provider name</label>
    </sdpi-item>

    <div class="info">After signing in, press the Stream Deck button once to load the latest quota and refresh the model list.</div>
    <div class="info"><span class="link" onclick="openGitHub()">View source on GitHub</span></div>

    <script>
        let _websocket = null;
        let _uuid = null;
        let _actionUUID = null;
        let _settings = {};

        function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
            _uuid = uuid;

            if (actionInfo) {
                const parsed = JSON.parse(actionInfo);
                _actionUUID = parsed?.action;
                _settings = parsed?.payload?.settings || {};

                if (_settings.availableModels && Array.isArray(_settings.availableModels)) {
                    populateModels(_settings.availableModels, _settings.availableModelLabels || {});
                }
            }

            _websocket = new WebSocket("ws://127.0.0.1:" + port);

            _websocket.onopen = function () {
                _websocket.send(JSON.stringify({ event: registerEvent, uuid }));
                sendToPlugin({ event: "getStatus" });
                sendToPlugin({ event: "getModels" });
            };

            _websocket.onmessage = function (evt) {
                const data = JSON.parse(evt.data);

                if (data.event === "sendToPropertyInspector") {
                    const payload = data.payload || {};
                    if (payload.event === "status") {
                        setAuthState(!!payload.loggedIn, payload.email || "");
                        if (!payload.loggedIn) {
                            populateModels([], {});
                        }
                    } else if (payload.event === "modelList" && Array.isArray(payload.models)) {
                        populateModels(payload.models, payload.labels || {});
                    } else if (payload.event === "loginError") {
                        setAuthError(payload.message || "Login failed");
                    }
                }

                if (data.event === "didReceiveSettings") {
                    _settings = data.payload?.settings || {};
                    if (_settings.availableModels && Array.isArray(_settings.availableModels)) {
                        populateModels(_settings.availableModels, _settings.availableModelLabels || {});
                    }
                    applySettings();
                }
            };
        }

        function sendToPlugin(payload) {
            if (!_websocket || !_actionUUID) return;
            _websocket.send(JSON.stringify({
                action: _actionUUID,
                event: "sendToPlugin",
                context: _uuid,
                payload,
            }));
        }

        function setAuthState(loggedIn, email) {
            const status = document.getElementById("authStatus");
            const loginBtn = document.getElementById("loginBtn");
            const logoutBtn = document.getElementById("logoutBtn");
            loginBtn.disabled = false;

            if (loggedIn) {
                status.textContent = email ? `Signed in as ${email}` : "Signed in";
                status.classList.remove("err");
                status.classList.add("ok");
                loginBtn.style.display = "none";
                logoutBtn.style.display = "";
            } else {
                status.textContent = "Not signed in";
                status.classList.remove("err", "ok");
                loginBtn.style.display = "";
                logoutBtn.style.display = "none";
            }
        }

        function setAuthError(msg) {
            const status = document.getElementById("authStatus");
            status.textContent = msg;
            status.classList.remove("ok");
            status.classList.add("err");
            document.getElementById("loginBtn").disabled = false;
        }

        const MODEL_SELECTS = ["model", "topModel", "bottomModel"];

        function populateModels(models, labels) {
            MODEL_SELECTS.forEach(function (id) {
                const select = document.getElementById(id);

                while (select.options.length > 1) select.remove(1);

                models.forEach(function (modelId) {
                    const opt = document.createElement("option");
                    opt.value = modelId;
                    opt.textContent = labels[modelId] || modelId;
                    select.appendChild(opt);
                });
            });

            applySettings();
        }

        function applySettings() {
            MODEL_SELECTS.forEach(function (id) {
                if (_settings[id] !== undefined) document.getElementById(id).value = _settings[id];
            });
            document.getElementById("layout").value = _settings.layout || "bars";
            document.getElementById("showProviderName").checked = _settings.showProviderName !== false;
            applyLayoutVisibility();
        }

        function applyLayoutVisibility() {
            const isRing = document.getElementById("layout").value === "ring";
            document.getElementById("ringRow").classList.toggle("hidden", !isRing);
            document.getElementById("topRow").classList.toggle("hidden", isRing);
            document.getElementById("bottomRow").classList.toggle("hidden", isRing);
        }

        function saveSettings() {
            MODEL_SELECTS.forEach(function (id) {
                _settings[id] = document.getElementById(id).value;
            });
            _settings.layout = document.getElementById("layout").value || "bars";
            _settings.showProviderName = document.getElementById("showProviderName").checked;
            applyLayoutVisibility();

            if (_websocket && _uuid) {
                _websocket.send(JSON.stringify({
                    event: "setSettings",
                    context: _uuid,
                    payload: _settings,
                }));
            }
        }

        function openGitHub() {
            if (_websocket) {
                _websocket.send(JSON.stringify({
                    event: "openUrl",
                    payload: {
                        url: "https://github.com/lenadweb/stream-deck-ai-limits"
                    }
                }));
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            ["layout", "model", "topModel", "bottomModel", "showProviderName"].forEach(function (id) {
                document.getElementById(id).addEventListener("change", saveSettings);
            });
            applySettings();
            document.getElementById("loginBtn").addEventListener("click", function () {
                const status = document.getElementById("authStatus");
                status.textContent = "Opening browser…";
                status.classList.remove("err", "ok");
                this.disabled = true;
                sendToPlugin({ event: "login" });
            });
            document.getElementById("logoutBtn").addEventListener("click", function () {
                sendToPlugin({ event: "logout" });
            });
        });
    </script>
</body>

</html>
