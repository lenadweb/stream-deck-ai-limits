<!DOCTYPE html>
<html>

<head lang="en">
    <title>Claude Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .info {
            padding: 8px 16px;
            font-size: 11px;
            color: #999;
            line-height: 1.4;
        }
        .link {
            color: #4285F4;
            cursor: pointer;
            text-decoration: underline;
        }
        .link:hover {
            color: #357ae8;
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #ddd;
            cursor: pointer;
        }
        .checkbox input {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        select.sdpi-item-value {
            width: 100%;
            padding: 4px 8px;
            border-radius: 4px;
            background: #2d2d2d;
            color: #ddd;
            border: 1px solid #444;
            font-size: 12px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <sdpi-item label="Layout">
        <select id="layout" class="sdpi-item-value">
            <option value="ring">Ring (one metric)</option>
            <option value="bars">Bars (two metrics)</option>
        </select>
    </sdpi-item>

    <sdpi-item id="ringRow" label="Metric">
        <select id="metric" class="sdpi-item-value">
            <option value="session">Session (5h)</option>
            <option value="weekly">Week (7d)</option>
            <option value="weeklySonnet">Sonnet week (7d)</option>
        </select>
    </sdpi-item>

    <sdpi-item id="topRow" label="Top">
        <select id="topMetric" class="sdpi-item-value">
            <option value="session">Session (5h)</option>
            <option value="weekly">Week (7d)</option>
            <option value="weeklySonnet">Sonnet week (7d)</option>
        </select>
    </sdpi-item>

    <sdpi-item id="bottomRow" label="Bottom">
        <select id="bottomMetric" class="sdpi-item-value">
            <option value="session">Session (5h)</option>
            <option value="weekly">Week (7d)</option>
            <option value="weeklySonnet">Sonnet week (7d)</option>
        </select>
    </sdpi-item>

    <sdpi-item label="Display">
        <label class="checkbox"><input id="showProviderName" type="checkbox" /> Show provider name</label>
    </sdpi-item>

    <div class="info">Place this action twice to watch two windows side by side, e.g. one tile on Session and one on Week.</div>
    <div class="info">Credentials for Claude are automatically loaded from your system (macOS Keychain or ~/.claude/.credentials.json).</div>
    <div class="info"><span class="link" onclick="openGitHub()">View source on GitHub</span></div>

    <script>
        let _websocket = null;
        let _uuid = null;
        let _settings = {};

        function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
            _uuid = uuid;

            if (actionInfo) {
                const parsed = JSON.parse(actionInfo);
                _settings = parsed?.payload?.settings || {};
            }

            _websocket = new WebSocket("ws://127.0.0.1:" + port);

            _websocket.onopen = function () {
                _websocket.send(JSON.stringify({ event: registerEvent, uuid: uuid }));

                // Ask the plugin which model-scoped limits this account reports
                _websocket.send(JSON.stringify({
                    action: "com.len.limits.progress",
                    event: "sendToPlugin",
                    context: uuid,
                    payload: { event: "getScopes" }
                }));

                populateScopes(_settings.availableScopes || []);
            };

            _websocket.onmessage = function (evt) {
                const data = JSON.parse(evt.data);

                if (data.event === "sendToPropertyInspector"
                    && data.payload?.event === "scopeList"
                    && Array.isArray(data.payload.scopes)) {
                    populateScopes(data.payload.scopes);
                }

                if (data.event === "didReceiveSettings") {
                    _settings = data.payload?.settings || {};
                    populateScopes(_settings.availableScopes || []);
                }
            };
        }

        const METRIC_SELECTS = ["metric", "topMetric", "bottomMetric"];
        const SCOPE_PREFIX = "scoped:";

        function scopeOption(model) {
            const option = document.createElement("option");
            option.value = SCOPE_PREFIX + model;
            option.textContent = model + " week (7d)";
            option.dataset.scope = model;
            return option;
        }

        // Replaces the scoped options and leaves the fixed windows in the markup alone.
        function populateScopes(scopes) {
            METRIC_SELECTS.forEach(function (id) {
                const select = document.getElementById(id);

                select.querySelectorAll("option[data-scope]").forEach(function (option) {
                    option.remove();
                });

                scopes.forEach(function (model) {
                    select.appendChild(scopeOption(model));
                });
            });

            applySettings();
        }

        // A saved scoped metric may not be in the list yet when this runs, and
        // assigning an unknown value would silently reset the select, so add it.
        function setMetric(id, value) {
            const select = document.getElementById(id);
            const known = Array.prototype.some.call(select.options, function (o) { return o.value === value; });
            if (!known && value.indexOf(SCOPE_PREFIX) === 0) {
                select.appendChild(scopeOption(value.slice(SCOPE_PREFIX.length)));
            }
            select.value = value;
        }

        function applySettings() {
            document.getElementById("showProviderName").checked = _settings.showProviderName !== false;
            document.getElementById("layout").value = _settings.layout || "bars";
            setMetric("metric", _settings.metric || "session");
            setMetric("topMetric", _settings.topMetric || "session");
            setMetric("bottomMetric", _settings.bottomMetric || "weekly");
            applyLayoutVisibility();
        }

        function applyLayoutVisibility() {
            const isRing = document.getElementById("layout").value === "ring";
            document.getElementById("ringRow").classList.toggle("hidden", !isRing);
            document.getElementById("topRow").classList.toggle("hidden", isRing);
            document.getElementById("bottomRow").classList.toggle("hidden", isRing);
        }

        function saveSettings() {
            _settings.showProviderName = document.getElementById("showProviderName").checked;
            _settings.layout = document.getElementById("layout").value || "bars";
            _settings.metric = document.getElementById("metric").value || "session";
            _settings.topMetric = document.getElementById("topMetric").value || "session";
            _settings.bottomMetric = document.getElementById("bottomMetric").value || "weekly";
            applyLayoutVisibility();
            if (_websocket && _uuid) {
                _websocket.send(JSON.stringify({
                    event: "setSettings",
                    context: _uuid,
                    payload: _settings,
                }));
            }
        }

        function openGitHub() {
            if (_websocket) {
                _websocket.send(JSON.stringify({
                    event: "openUrl",
                    payload: {
                        url: "https://github.com/lenadweb/stream-deck-ai-limits"
                    }
                }));
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            ["showProviderName", "layout", "metric", "topMetric", "bottomMetric"].forEach(function (id) {
                document.getElementById(id).addEventListener("change", saveSettings);
            });
            applySettings();
        });
    </script>
</body>

</html>
